<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .test { background: white; padding: 20px; margin: 10px 0; border-radius: 5px; border-left: 4px solid #3b82f6; }
        .error { border-left-color: #ef4444; }
        .success { border-left-color: #10b981; }
        pre { background: #eee; padding: 10px; overflow-x: auto; font-size: 12px; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h1>🧪 Test Supabase REST API</h1>
    <button onclick="testSupabase()">Hacer POST de prueba</button>
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');
        
        async function testSupabase() {
            resultsDiv.innerHTML = '<div class="test"><p>Enviando...</p></div>';
            
            const config = {
                url: 'https://browefuzmakvpksxqytm.supabase.co',
                anonKey: 'sb_publishable_P_zWrKdGTuo6JmV-6aco9Q_HJk5H6wk',
                table: 'respuestas_senior_activa'
            };
            
            const payload = {
                codigo_participante: 'Test desde HTML',
                edad_mascota: 9,
                estrato_socioeconomico: 3,
                edad_persona: 40,
                sexo_persona: 'Femenino',
                genero: 'Femenino',
                intencion: 'Definitivamente sí',
                acepta_red_cerrada: 'Sí',
                precio: '$650.000 a $800.000',
                importancias_coberturas: {},
                comentario: 'test',
                mejora: 'test',
                fecha: new Date().toISOString(),
                version_prototipo: '3.2',
                modalidad: 'red prestacional cerrada sin reembolso externo'
            };
            
            try {
                console.log('Enviando:', JSON.stringify(payload).substring(0, 100));
                
                const response = await fetch(
                    `${config.url}/rest/v1/${config.table}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': config.anonKey,
                            'Authorization': `Bearer ${config.anonKey}`,
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify(payload)
                    }
                );
                
                const text = await response.text();
                const className = response.ok ? 'success' : 'error';
                
                resultsDiv.innerHTML = `
                    <div class="test ${className}">
                        <h3>${response.ok ? '✅ ÉXITO' : '❌ ERROR'}</h3>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>Respuesta:</strong></p>
                        <pre>${text || '(vacía)'}</pre>
                    </div>
                `;
                
                console.log('Response:', { status: response.status, ok: response.ok, text });
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test error">
                        <h3>❌ EXCEPCIÓN</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
                console.error('Error completo:', error);
            }
        }
    </script>
</body>
</html>
